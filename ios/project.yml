# Xcode project definition — regenerate with `xcodegen` after editing.
# The native app talks to the same Supabase project as the web app, so both
# carers see the same data under the same accounts (RLS enforces access).
name: Beanlo
options:
  bundleIdPrefix: io.morta
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true

packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: 2.0.0

# One shared scheme: always run the APP (the widget extension is built and
# embedded automatically — running it directly just errors at SpringBoard).
schemes:
  Beanlo:
    build:
      targets:
        Beanlo: all
        BeanloTests: [test]
        BeanloUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - BeanloTests
        - BeanloUITests
    archive:
      config: Release

targets:
  Beanlo:
    type: application
    platform: iOS
    sources:
      - Beanlo
      - SharedKit
    dependencies:
      - package: Supabase
        product: Supabase
      - target: BeanloWidgets
        embed: true
    entitlements:
      path: Beanlo/Beanlo.entitlements
      properties:
        # Signed by the paid Developer Program team; Xcode flips this to
        # production automatically when archiving for TestFlight.
        aps-environment: development
        com.apple.security.application-groups:
          - group.io.beanlo
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.beanlo
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: 15
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: DZ9VAB947K
    info:
      path: Beanlo/Info.plist
      properties:
        CFBundleDisplayName: Beanlo
        UILaunchScreen:
          UIColorName: LaunchBackground
        ITSAppUsesNonExemptEncryption: false
        UIUserInterfaceStyle: Automatic
        NSSupportsLiveActivities: true
        NSCameraUsageDescription: Beanlo uses the camera to photograph a nappy so its contents and colour are kept with the entry for your records.
        CFBundleURLTypes:
          - CFBundleURLName: io.beanlo
            CFBundleURLSchemes: [beanlo]

  # Unit tests run inside the app process (@testable import Beanlo) so the
  # clinical/prediction/E2EE logic is tested exactly as shipped.
  BeanloTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - BeanloTests
    dependencies:
      - target: Beanlo
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.beanlo.tests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Beanlo.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Beanlo
        BUNDLE_LOADER: $(TEST_HOST)
        DEVELOPMENT_TEAM: DZ9VAB947K

  # UI tests drive the real app in the simulator (XCUITest can tap, unlike
  # simctl) against a seeded throwaway world — see scripts/test-ios.sh.
  BeanloUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - BeanloUITests
    dependencies:
      - target: Beanlo
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.beanlo.uitests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"
        TEST_TARGET_NAME: Beanlo
        DEVELOPMENT_TEAM: DZ9VAB947K

  BeanloWidgets:
    type: app-extension
    platform: iOS
    sources:
      - BeanloWidgets
      - SharedKit
    entitlements:
      path: BeanloWidgets/BeanloWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.io.beanlo
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.beanlo.widgets
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: 15
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: YES
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: DZ9VAB947K
    info:
      path: BeanloWidgets/Info.plist
      properties:
        CFBundleDisplayName: Beanlo
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
