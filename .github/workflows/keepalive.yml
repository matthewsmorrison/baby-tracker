name: Supabase keepalive

# Free Supabase projects pause after ~7 days of inactivity. A lightweight
# scheduled query keeps the database active so the app never cold-starts.
on:
  schedule:
    - cron: "17 6 */2 * *" # every 2 days, 06:17 UTC (odd minute avoids peak load)
  workflow_dispatch: {} # allow manual runs from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Query Supabase to keep the project awake
        run: |
          code=$(curl -sS -o /dev/null -w "%{http_code}" \
            "${{ secrets.SUPABASE_URL }}/rest/v1/babies?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}")
          echo "Supabase responded with HTTP $code"
          # 200 (rows or RLS-empty) both prove the DB served the request.
          if [ "$code" != "200" ]; then
            echo "::error::Unexpected status $code — project may be paused or misconfigured."
            exit 1
          fi
